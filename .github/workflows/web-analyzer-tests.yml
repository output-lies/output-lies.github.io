# AI-Assisted.
# Runs the dist-ai web-analyzer test suite against this repo's analyze/analyzer.js.
# The suite lives in org-ai-assisted/dist-ai (too high-volume for human review);
# here we only check out the repos as siblings and point OUTPUT_LIES_REPO at this
# checkout. debian:trixie-slim matches the dist-ai CI runtime.
name: web-analyzer-tests

on:
  push:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    timeout-minutes: 15
    paths:
      - 'analyze/**'
      - '.github/workflows/web-analyzer-tests.yml'
  pull_request:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    timeout-minutes: 15
    paths:
      - 'analyze/**'
      - '.github/workflows/web-analyzer-tests.yml'

permissions:
  contents: read

## One run per ref; a superseded push has nothing to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-analyzer-tests:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install tools
        run: apt-get update && apt-get install --yes --no-install-recommends git nodejs ca-certificates

      - name: Check out output-lies.github.io
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: output-lies
          ## The next step executes dist-ai's code in this workspace. Checkout
          ## otherwise leaves this repo's GITHUB_TOKEN in .git/config, where
          ## that foreign code can read it. Nothing here pushes.
          persist-credentials: false

      - name: Check out dist-ai (test suite)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false

      - name: Check out helper-scripts (sourced by the suite entrypoint)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: org-ai-assisted/helper-scripts
          ref: master
          path: helper-scripts
          persist-credentials: false

      - name: Provide helper-scripts runtime at the system path
        ## web-analyzer-tests sources has.sh through the absolute
        ## /usr/libexec/helper-scripts path, which no debian:trixie-slim image
        ## carries. This is the same committed dist-ai/ci script that
        ## reusable-dist-ai-tests.yml runs for a consumer declaring
        ## 'dist-ai-tests.helper-scripts: true'; the lane is bespoke because
        ## analyzer.js is not a derivative-maker component, so the dependency is
        ## declared here rather than in .github/dm-consumer.yml.
        run: dist-ai/ci/dist-ai-tests-ci-hs-runtime.sh "${GITHUB_WORKSPACE}/helper-scripts"

      - name: Run web-analyzer-tests
        run: OUTPUT_LIES_REPO="${GITHUB_WORKSPACE}/output-lies" bash dist-ai/usr/bin/web-analyzer-tests
